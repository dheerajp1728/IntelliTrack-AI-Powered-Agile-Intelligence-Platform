version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/intellitrack-frontend

  build:
    commands:
      - echo Building frontend Docker image...
      - docker build -f docker/Dockerfile.frontend -t $IMAGE_URI:latest -t $IMAGE_URI:$IMAGE_TAG .

  post_build:
    commands:
      - echo Pushing frontend image to ECR...
      - docker push $IMAGE_URI:latest
      - docker push $IMAGE_URI:$IMAGE_TAG
      - echo Build complete. Image $IMAGE_URI:$IMAGE_TAG pushed.
      - printf '[{"name":"frontend","imageUri":"%s"}]' "$IMAGE_URI:$IMAGE_TAG" > imagedefinitions.json
      - echo Deploying to ECS...
      - aws ecs update-service --cluster intellitrack --service intellitrack-frontend --force-new-deployment --region $AWS_DEFAULT_REGION
      - echo Waiting for ECS deployment to stabilize...
      - aws ecs wait services-stable --cluster intellitrack --services intellitrack-frontend --region $AWS_DEFAULT_REGION
      - echo ECS deployment complete.

artifacts:
  files:
    - imagedefinitions.json
